<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Urban Studio · Programări online</title>
  <meta name="description" content="Programează-te online la Urban Studio Barbering &amp; Academy din Ploiești. Alegi serviciul, frizerul și ora, iar noi îți amintim cu o zi înainte.">
  <meta name="theme-color" content="#0E0F11">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Urban Studio">
  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Urban Studio · Programări online">
  <meta property="og:description" content="Barbershop și academie în Ploiești. Programează-te în câteva secunde.">
  <meta property="og:url" content="https://tibidinu1031.github.io/urbanstudio/">
  <meta property="og:image" content="https://tibidinu1031.github.io/urbanstudio/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ro_RO">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="modulepreload" href="assets/js/lib.js">
  <link rel="modulepreload" href="assets/js/data.js">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body class="booting">

  <!-- Splash: logo desenat linie cu linie + bară de încărcare în culorile stâlpului de frizerie -->
  <div id="splash" class="splash" role="status" aria-label="Se încarcă Urban Studio">
    <div class="splash__center">
      <div class="splash__logo" id="splash-logo">
        <svg class="logo" viewBox="40 84 416 296" aria-hidden="true">
          <defs>
            <clipPath id="sp-l1"><rect x="0" y="137.5" width="500" height="101.5"/></clipPath>
            <clipPath id="sp-l2"><rect x="0" y="281.25" width="500" height="92.75"/></clipPath>
          </defs>
          <g fill="none" stroke="currentColor">
            <g clip-path="url(#sp-l1)" stroke-width="13">
              <path class="lg-s" style="--i:0" pathLength="1" d="M52.1 130V205.3A27.2 27.2 0 0 0 106.5 205.3V130"/>
              <path class="lg-s" style="--i:1" pathLength="1" d="M135 246V148A4 4 0 0 1 139 144H163.25A21.75 21.75 0 0 1 163.25 187.5H135"/>
              <path class="lg-s" style="--i:2" pathLength="1" d="M156.8 187.5L186.5 246"/>
              <path class="lg-s" style="--i:3" pathLength="1" d="M205 144H238.75A21.95 21.95 0 0 1 238.75 187.9"/>
              <path class="lg-s" style="--i:4" pathLength="1" d="M238 187.9H215A4 4 0 0 0 211 191.9V229.35A4 4 0 0 0 215 233.35H238A22.725 22.725 0 0 0 238 187.9"/>
              <path class="lg-s" style="--i:7" pathLength="1" d="M383.75 246V140L444.4 236V130"/>
            </g>
            <g class="lg-blade lg-blade-l">
              <path class="lg-s" style="--i:5" pathLength="1" stroke-width="11" stroke-linecap="round" d="M300.5 104.5L360 233"/>
              <circle class="lg-dot" style="--dl:.62s" cx="300.5" cy="104.5" r="15.5" fill="currentColor" stroke="none"/>
            </g>
            <g class="lg-blade lg-blade-r">
              <path class="lg-s" style="--i:6" pathLength="1" stroke-width="11" stroke-linecap="round" d="M345.6 104.5L283.5 233"/>
              <circle class="lg-dot" style="--dl:.7s" cx="345.6" cy="104.5" r="15.5" fill="currentColor" stroke="none"/>
            </g>
            <g clip-path="url(#sp-l2)" stroke-width="12">
              <path class="lg-s" style="--i:8" pathLength="1" d="M107.5 287.5H77.5A20.5 20.5 0 0 0 77.5 328.5H81.1A19.5 19.5 0 0 1 81.1 367.5H50"/>
              <path class="lg-s" style="--i:9" pathLength="1" d="M115 287.5H178.75M146.25 282V380"/>
              <path class="lg-s" style="--i:10" pathLength="1" d="M190.6 275V343.8A23.95 23.95 0 0 0 238.5 343.8V275"/>
              <path class="lg-s" style="--i:11" pathLength="1" d="M259.5 287.5H280A40 40 0 0 1 280 367.5H259.5"/>
              <path class="lg-s" style="--i:12" pathLength="1" stroke-linecap="round" d="M342.4 308.5V380"/>
              <circle class="lg-s" style="--i:13" pathLength="1" cx="405.6" cy="327.9" r="39.7" transform="rotate(-90 405.6 327.9)"/>
            </g>
            <circle class="lg-dot" style="--dl:1.1s" cx="343.1" cy="286.25" r="6.9" fill="currentColor" stroke="none"/>
          </g>
        </svg>
      </div>
      <div class="pole" role="progressbar" aria-label="Încărcare" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="pole__fill" id="pole-fill"></div>
      </div>
      <p class="splash__tag">Barbering &amp; Academy</p>
    </div>
  </div>

  <div class="app" id="app">
    <main id="main">
      <section class="view" id="view-home" data-view="home" aria-label="Acasă"></section>
      <section class="view" id="view-book" data-view="book" aria-label="Programează" hidden></section>
      <section class="view" id="view-agenda" data-view="agenda" aria-label="Agenda" hidden></section>
      <section class="view" id="view-about" data-view="about" aria-label="Despre salon" hidden></section>
    </main>

    <div class="cta" id="cta" aria-hidden="true">
      <div class="cta__sum"><b id="cta-title"></b><small id="cta-sub"></small></div>
      <button class="btn btn--primary" id="cta-btn" type="button"></button>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navigare principală">
      <div class="tabbar__glass" id="tabbar-glass">
        <span class="tabbar__pill" id="tabbar-pill" aria-hidden="true"></span>
        <button class="tab" type="button" data-tab="home" aria-label="Acasă"></button>
        <button class="tab" type="button" data-tab="book" aria-label="Programează"></button>
        <button class="tab" type="button" data-tab="agenda" aria-label="Agenda"></button>
        <button class="tab" type="button" data-tab="about" aria-label="Despre salon"></button>
      </div>
    </nav>
  </div>

  <div id="sheet-host"></div>
  <div id="toast-host" aria-live="polite" aria-atomic="true"></div>
  <label class="haptic" id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <noscript>
    <div class="noscript">Aplicația are nevoie de JavaScript. Ne poți suna la <a href="tel:+40736570863">0736 570 863</a>.</div>
  </noscript>
</body>
</html>
